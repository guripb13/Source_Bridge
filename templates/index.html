<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Input Box Replica</title>
<style>
  :root{
    --bg: #F4F1EA;
    --box-bg: #ffffff;
    --border: #e5e1d8;
    --border-focus: #c9c2b2;
    --text: #2d2a26;
    --placeholder: #9b968c;
    --accent: #D97757;
    --accent-hover: #c96a4c;
    --icon: #6b6660;
    --icon-hover: #2d2a26;
    --shadow: rgba(0,0,0,0.06);
    --ring: rgba(217,119,87,0.15);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--text);
    padding:24px;
  }

  .page{
    width:100%;
    max-width:720px;
  }

  .page h1{
    font-size:15px;
    font-weight:500;
    color:var(--icon);
    text-align:center;
    margin:0 0 20px;
  }

  .composer{
    position:relative;
    background:var(--box-bg);
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:0 1px 2px var(--shadow), 0 4px 16px var(--shadow);
    padding:14px 14px 10px;
    transition:border-color .25s ease, box-shadow .25s ease, transform .15s ease;
  }

  .composer.focused{
    border-color:var(--border-focus);
    box-shadow:0 0 0 4px var(--ring), 0 4px 20px var(--shadow);
  }

  /* attachment chips */
  .attachments{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 4px 10px;
  }

  .attachments:empty{ display:none; margin:0; }

  .chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:#f6f3ec;
    border:1px solid var(--border);
    border-radius:12px;
    padding:7px 10px;
    font-size:13px;
    color:var(--text);
    animation:chip-in .18s ease;
    max-width:220px;
  }

  @keyframes chip-in{
    from{ opacity:0; transform:translateY(4px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .chip-icon{
    width:26px;height:26px;border-radius:7px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .chip-icon svg{ width:14px;height:14px; stroke:#fff; }

  .chip-name{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-weight:500;
  }

  .chip-remove{
    background:none;border:none;cursor:pointer;
    color:var(--icon);
    display:flex;align-items:center;justify-content:center;
    padding:2px;border-radius:50%;
    flex-shrink:0;
  }
  .chip-remove:hover{ background:rgba(0,0,0,0.06); color:var(--icon-hover); }

  /* editable input area */
  .input-row{
    position:relative;
    min-height:28px;
  }

  .editor{
    width:100%;
    min-height:28px;
    max-height:260px;
    overflow-y:auto;
    font-size:16px;
    line-height:1.5;
    color:var(--text);
    outline:none;
    white-space:pre-wrap;
    word-wrap:break-word;
    padding:2px 4px;
  }

  .editor:empty::before{
    content: attr(data-placeholder);
    color:var(--placeholder);
    pointer-events:none;
  }

  /* toolbar */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    padding:0 2px;
  }

  .toolbar-left, .toolbar-right{
    display:flex;
    align-items:center;
    gap:4px;
  }

  .icon-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid transparent;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--icon);
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }

  .icon-btn:hover{
    background:#f0ede4;
    color:var(--icon-hover);
  }

  .icon-btn:active{ transform:scale(.92); }

  .icon-btn svg{ width:19px;height:19px; }

  .model-pill{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border);
    border-radius:16px;
    padding:6px 12px 6px 10px;
    font-size:13px;
    color:var(--icon);
    background:transparent;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .model-pill:hover{ background:#f0ede4; border-color:var(--border-focus); }
  .model-pill svg{ width:14px;height:14px; }

  .send-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:#d8d4c8;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:not-allowed;
    transition:background .2s ease, transform .12s ease, opacity .2s ease;
  }

  .send-btn svg{ width:16px;height:16px; }

  .send-btn.active{
    background:var(--accent);
    cursor:pointer;
  }
  .send-btn.active:hover{ background:var(--accent-hover); }
  .send-btn.active:active{ transform:scale(.9); }

  /* pulse ring animation when a message is "sent" */
  @keyframes pulse-ring{
    0%{ box-shadow:0 0 0 0 rgba(217,119,87,0.45); }
    100%{ box-shadow:0 0 0 14px rgba(217,119,87,0); }
  }
  .send-btn.pulse{ animation:pulse-ring .5s ease-out; }

  .hint{
    text-align:center;
    font-size:12px;
    color:var(--placeholder);
    margin-top:14px;
  }

  .toast{
    position:fixed;
    bottom:24px;left:50%;
    transform:translateX(-50%) translateY(12px);
    background:#2d2a26;
    color:#fff;
    font-size:13px;
    padding:9px 16px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="page">
  <h1>Message input</h1>

  <div class="composer" id="composer">
    <div class="attachments" id="attachments"></div>

    <div class="input-row">
      <div
        class="editor"
        id="editor"
        contenteditable="true"
        data-placeholder="How can I help you today?"
      ></div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="icon-btn" id="attachBtn" title="Attach file / paste to test plain-text conversion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button class="model-pill" id="modelPill">
          Claude Sonnet
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>

      <div class="toolbar-right">
        <button class="send-btn" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <p class="hint">Type normally, or paste rich/formatted text (from Word, a webpage, etc.) — it will automatically be flattened to plain text. Try attaching a file too.</p>
</div>

<div class="toast" id="toast">Message sent</div>

<input type="file" id="fileInput" multiple style="display:none">

<script>
  const composer   = document.getElementById('composer');
  const editor     = document.getElementById('editor');
  const sendBtn    = document.getElementById('sendBtn');
  const attachBtn  = document.getElementById('attachBtn');
  const fileInput  = document.getElementById('fileInput');
  const attachWrap = document.getElementById('attachments');
  const toast      = document.getElementById('toast');

  // ---- focus ring animation ----
  editor.addEventListener('focus', () => composer.classList.add('focused'));
  editor.addEventListener('blur',  () => composer.classList.remove('focused'));

  // ---- send button enable/disable based on content ----
  function hasContent(){
    return editor.textContent.trim().length > 0 || attachWrap.children.length > 0;
  }

  function refreshSendState(){
    sendBtn.classList.toggle('active', hasContent());
  }

  editor.addEventListener('input', refreshSendState);

  // ---- CORE FEATURE: paste as plain text ----
  // Whatever is copied (rich HTML from a webpage, a Word doc, formatted email, etc.)
  // gets converted into plain text before it lands in the input box.
  editor.addEventListener('paste', (e) => {
    e.preventDefault();
    const plainText = (e.clipboardData || window.clipboardData).getData('text/plain');
    insertPlainText(plainText);
  });

  function insertPlainText(text){
    const selection = window.getSelection();
    if (!selection.rangeCount) return;
    const range = selection.getRangeAt(0);
    range.deleteContents();

    // Insert as plain text nodes (line breaks become <br> so multi-line paste still works,
    // but no bold/italic/color/font/table/etc. survives)
    const lines = text.split(/\r\n|\r|\n/);
    const frag = document.createDocumentFragment();
    lines.forEach((line, i) => {
      frag.appendChild(document.createTextNode(line));
      if (i < lines.length - 1) frag.appendChild(document.createElement('br'));
    });

    range.insertNode(frag);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);

    refreshSendState();
  }

  // ---- autosizing is automatic via contenteditable + max-height/overflow ----

  // ---- Enter to send, Shift+Enter for newline ----
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      trySend();
    }
  });

  sendBtn.addEventListener('click', trySend);

  function trySend(){
    if (!hasContent()) return;

    sendBtn.classList.remove('pulse');
    void sendBtn.offsetWidth; // restart animation
    sendBtn.classList.add('pulse');

    showToast('Message sent');

    editor.textContent = '';
    attachWrap.innerHTML = '';
    refreshSendState();
    editor.focus();
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  // ---- file attachment chips ----
  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    [...fileInput.files].forEach(addChip);
    fileInput.value = '';
    refreshSendState();
  });

  function addChip(file){
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `
      <div class="chip-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <span class="chip-name">${escapeHtml(file.name)}</span>
      <button class="chip-remove" title="Remove">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    `;
    chip.querySelector('.chip-remove').addEventListener('click', () => {
      chip.remove();
      refreshSendState();
    });
    attachWrap.appendChild(chip);
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // allow dropping files onto the composer too
  ['dragover'].forEach(evt => composer.addEventListener(evt, (e) => e.preventDefault()));
  composer.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length){
      [...e.dataTransfer.files].forEach(addChip);
      refreshSendState();
    }
  });

  refreshSendState();
</script>

</body>
</html>
