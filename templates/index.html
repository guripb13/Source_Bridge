<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Input Box</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page">
  <h1>Message input</h1>

  <!-- Messages and replies appear here -->
  <div class="messages" id="messages"></div>

  <form class="composer" id="form" method="POST" action="{{ url_for('send') }}" enctype="multipart/form-data">

    <textarea name="message" id="message" rows="2" placeholder="How can I help you today?"></textarea>

    <div class="toolbar">
      <div class="left">
        <input type="file" name="attachment" id="attachment">
        <label for="attachment" class="icon-btn" title="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </label>

        <span class="model-pill">Claude Sonnet</span>
      </div>

      <button type="submit" class="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </form>
</div>

<script>
  const form = document.getElementById("form");
  const box = document.getElementById("message");
  const messages = document.getElementById("messages");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();                         // stop the page from reloading

    const text = box.value.trim();
    if (!text) return;

    // 1. Show the user's message
    const userDiv = document.createElement("div");
    userDiv.className = "message";
    userDiv.style.whiteSpace = "pre-wrap";
    userDiv.textContent = text;
    messages.appendChild(userDiv);

    // 2. Create an empty reply box that we will fill up
    const replyDiv = document.createElement("div");
    replyDiv.className = "message reply";
    replyDiv.style.whiteSpace = "pre-wrap";
    messages.appendChild(replyDiv);

    // 3. Send the form to Flask
    const data = new FormData(form);
    box.value = "";                                 // clear the input box

    const response = await fetch("/send", { method: "POST", body: data });

    // 4. Read the reply piece by piece
    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const result = await reader.read();
      if (result.done) break;                       // no more pieces
      replyDiv.textContent += decoder.decode(result.value, { stream: true });
    }
  });
</script>

</body>
</html>
