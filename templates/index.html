<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Input Box</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page empty" id="page">
 <h1 id="title">SOURCE BRIDGE</h1> 

  <!-- Messages and replies appear here -->
  <div class="messages" id="messages"></div>
   <div class="tip" id="tip">
    <span class="tip-icon">💡</span>
    <span class="tip-text">
      Tip: hold <kbd>Ctrl</kbd> and drag any message or reply to drop it anywhere.
    </span>
    <button type="button" class="tip-close" id="tipClose" title="Close">✕</button>
  </div>
  <form class="composer" id="form" method="POST" action="{{ url_for('send') }}" enctype="multipart/form-data">

    <textarea name="message" id="message" rows="2" placeholder="How can I help you today?"></textarea>

    <div class="toolbar">
      <div class="left">
        <input type="file" name="attachment" id="attachment">
        <label for="attachment" class="icon-btn" title="Attach file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </label>

        <div class="lang-picker" id="langPicker">

  <!-- The button -->
  <button type="button" class="model-pill" id="langBtn">
    <span id="langLabel">Java</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <!-- The menu that opens above the button -->
  <div class="lang-menu" id="langMenu">
    <button type="button" class="lang-option" data-lang="Python">Python</button>
    <button type="button" class="lang-option" data-lang="C">C</button>
    <button type="button" class="lang-option" data-lang="C++">C++</button>
    <button type="button" class="lang-option active" data-lang="Java">Java</button>
    <button type="button" class="lang-option" data-lang="other">Other...</button>

    <!-- Only shows when "Other" is chosen -->
    <div class="lang-other-row" id="langOtherRow">
  <input type="text" class="lang-other" id="langOther" placeholder="Type a language...">
  <button type="button" class="lang-done" id="langDone" title="Done" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </button>
</div>
  </div>

  <!-- Hidden field: this is what gets sent to Flask -->
  <input type="hidden" name="language" id="language" value="Java">
</div>
      </div>

      <button type="submit" class="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </form>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
